name: Cypress tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pull-request-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cypress installation
        run: npx cypress verify

  cypress:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm test
        env:
          CYPRESS_PRACTICE_USERNAME: ${{ secrets.PRACTICE_USERNAME }}
          CYPRESS_PRACTICE_PASSWORD: ${{ secrets.PRACTICE_PASSWORD }}

      - name: Upload Cucumber JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json-report
          path: cypress/reports/cucumber-report.json
          if-no-files-found: warn

      - name: Import results into QMetry
        if: always() && hashFiles('cypress/reports/cucumber-report.json') != ''
        env:
          QMETRY_API_KEY: ${{ secrets.QMETRY_API_KEY }}
          QMETRY_API_URL: ${{ vars.QMETRY_API_URL }}
          QMETRY_ENVIRONMENT: ${{ vars.QMETRY_ENVIRONMENT }}
          QMETRY_BUILD: ${{ vars.QMETRY_BUILD }}
        run: |
          set -euo pipefail

          : "${QMETRY_API_KEY:?Add QMETRY_API_KEY as a GitHub Actions secret}"
          : "${QMETRY_API_URL:?Add QMETRY_API_URL as a repository variable}"
          : "${QMETRY_ENVIRONMENT:?Add QMETRY_ENVIRONMENT as a repository variable}"
          : "${QMETRY_BUILD:?Add QMETRY_BUILD as a repository variable}"
          case "$QMETRY_API_URL" in
            https://*) ;;
            *) echo "QMETRY_API_URL must use HTTPS" >&2; exit 1 ;;
          esac

          report="cypress/reports/cucumber-report.json"
          test -s "$report"
          jq -e 'type == "array"' "$report" >/dev/null

          request_body=$(jq -n \
            --arg environment "$QMETRY_ENVIRONMENT" \
            --arg build "$QMETRY_BUILD" \
            '{
              format: "cucumber",
              environment: $environment,
              build: $build,
              isZip: false,
              attachFile: true
            }')

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          request_qmetry() {
            local label="$1"
            shift

            echo "$label"
            local status
            status=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$@")

            if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
              echo "QMetry request failed with HTTP $status." >&2
              if test -s "$response_file"; then
                cat "$response_file" >&2
              fi
              return 1
            fi
          }

          request_qmetry "Requesting QMetry import" \
            --request POST \
            "$QMETRY_API_URL" \
            --header "Content-Type: application/json" \
            --header "apiKey: $QMETRY_API_KEY" \
            --data "$request_body"

          upload_url=$(jq -er '.url | select(type == "string" and startswith("https://"))' "$response_file")
          tracking_id=$(jq -er '.trackingId | select(type == "string" and length > 0)' "$response_file")

          request_qmetry "Uploading Cucumber report" \
            --request PUT \
            "$upload_url" \
            --header "Content-Type: multipart/form-data" \
            --data-binary "@$report"

          tracking_url="${QMETRY_API_URL%/}/track"
          for attempt in {1..12}; do
            echo "Checking QMetry import status (attempt $attempt/12)"
            status=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --get "$tracking_url" \
              --header "apiKey: $QMETRY_API_KEY" \
              --data-urlencode "trackingId=$tracking_id")

            if [[ "$status" =~ ^2[0-9]{2}$ ]]; then
              break
            fi

            if [[ "$status" != "404" || "$attempt" -eq 12 ]]; then
              echo "QMetry tracking request failed with HTTP $status." >&2
              if test -s "$response_file"; then
                cat "$response_file" >&2
              fi
              exit 1
            fi

            echo "QMetry has not created the tracking record yet; retrying in 5 seconds."
            sleep 5
          done

          echo "Report uploaded and QMetry tracking request succeeded."
