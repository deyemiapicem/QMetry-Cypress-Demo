name: Cypress tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm test
        env:
          CYPRESS_PRACTICE_USERNAME: ${{ secrets.PRACTICE_USERNAME }}
          CYPRESS_PRACTICE_PASSWORD: ${{ secrets.PRACTICE_PASSWORD }}
